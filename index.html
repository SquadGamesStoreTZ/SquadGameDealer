<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squardii Game Deals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <span class="icon">🎮</span>
            <h1>Squardii Game Deals</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Hero Search Section -->
        <section class="hero">
            <h2>Find the Best Game Deals & Discounts</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search for games (e.g., GTA, Need for Speed, Call of Duty)...">
                <button id="searchBtn">Search Deals</button>
            </div>
        </section>

        <!-- Games Grid Container -->
        <div class="games-grid" id="gamesContainer">
            <!-- Dynamic deal cards will render here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Updated real-time by Squardii Games. Data powered by CheapShark.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
